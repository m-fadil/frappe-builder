name: Release

on:
  # Tag refs only: one GHCR version per released tag.
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Prepare apps.json with secrets
        env:
          APPS_JSON_CONTENT: ${{ secrets.APPS_JSON }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          if [ -n "$APPS_JSON_CONTENT" ]; then
            echo "$APPS_JSON_CONTENT" > /tmp/apps.json
          elif [ -f apps.json ]; then
            eval "$(jq -r 'to_entries[] | select(.key | IN("APPS_JSON","github_token") | not) | "export \(.key)=\(.value|@sh)"' <<<"$SECRETS_CONTEXT")"
            envsubst < apps.json > /tmp/apps.json
          else
            echo "[]" > /tmp/apps.json
          fi

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: custom-frappe:verify
          secrets: |
            id=apps_json,src=/tmp/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint bash custom-frappe:verify -lc \
            "test -d /home/frappe/frappe-bench/apps/frappe && test -f /home/frappe/frappe-bench/assets/assets.json && bench --version"

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      # Required by attest-build-provenance to sign the pushed digest.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Prepare apps.json with secrets
        env:
          APPS_JSON_CONTENT: ${{ secrets.APPS_JSON }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          if [ -n "$APPS_JSON_CONTENT" ]; then
            echo "$APPS_JSON_CONTENT" > /tmp/apps.json
          elif [ -f apps.json ]; then
            eval "$(jq -r 'to_entries[] | select(.key | IN("APPS_JSON","github_token") | not) | "export \(.key)=\(.value|@sh)"' <<<"$SECRETS_CONTEXT")"
            envsubst < apps.json > /tmp/apps.json
          else
            echo "[]" > /tmp/apps.json
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # v1.2.3 -> :1.2.3, :1.2, :1, plus :latest
      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=custom-frappe-docker
            org.opencontainers.image.description=Production Frappe custom image with bundled apps and zero-downtime asset management

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          secrets: |
            id=apps_json,src=/tmp/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Attest provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}

      - name: Summary
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
