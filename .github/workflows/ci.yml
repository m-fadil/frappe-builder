name: CI

on:
  pull_request:
    branches: [main, master, develop, "custom/*"]
  push:
    branches: [main, master, develop, "custom/*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# vars.CACHE_BUST feeds the CACHE_BUST build-arg, which is referenced inside the
# `bench init` RUN and thus part of its cache key. Empty = cache hit.
env:
  CACHE_BUST: ${{ vars.CACHE_BUST }}

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Prepare apps.json with secrets
        env:
          # secrets.APPS_JSON, when set, bypasses the in-repo apps.json entirely
          APPS_JSON_CONTENT: ${{ secrets.APPS_JSON }}
          # toJson(secrets) is the only way to enumerate secret names at runtime
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          if [ -n "$APPS_JSON_CONTENT" ]; then
            echo "$APPS_JSON_CONTENT" > /tmp/apps.json
          elif [ -f apps.json ]; then
            # Hoist every secret into the env so envsubst resolves arbitrary
            # ${TOKEN} placeholders in apps.json. @sh quotes; APPS_JSON and the
            # auto-provisioned github_token are excluded.
            eval "$(jq -r 'to_entries[] | select(.key | IN("APPS_JSON","github_token") | not) | "export \(.key)=\(.value|@sh)"' <<<"$SECRETS_CONTEXT")"
            envsubst < apps.json > /tmp/apps.json
          else
            echo "[]" > /tmp/apps.json
          fi

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: custom-frappe:ci
          build-args: |
            CACHE_BUST=${{ env.CACHE_BUST }}
          secrets: |
            id=apps_json,src=/tmp/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint bash custom-frappe:ci -lc \
            "test -d /home/frappe/frappe-bench/apps/frappe && test -f /home/frappe/frappe-bench/assets/assets.json && bench --version"
