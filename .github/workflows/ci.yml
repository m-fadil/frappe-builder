name: CI

on:
  pull_request:
    branches: [main, master, develop, "custom/*"]
  push:
    branches: [main, master, develop, "custom/*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Prepare apps.json with secrets
        env:
          # Full override takes precedence if defined in GitHub Secrets
          APPS_JSON_CONTENT: ${{ secrets.APPS_JSON }}
          # Expose all environment secrets (default and app-specific tokens)
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
        run: |
          if [ -n "$APPS_JSON_CONTENT" ]; then
            echo "$APPS_JSON_CONTENT" > /tmp/apps.json
          elif [ -f apps.json ]; then
            # Export all GitHub secrets into the environment so envsubst can replace
            # any custom token variable (e.g. ${HRMS_PAT}, ${CUSTOM_APP_TOKEN}, ${GITLAB_PAT})
            eval "$(python3 -c '
import json, os, shlex
try:
    secrets = json.loads(os.environ.get("SECRETS_CONTEXT", "{}"))
    for k, v in secrets.items():
        if k not in ["APPS_JSON", "github_token"]:
            print(f"export {k}={shlex.quote(str(v))}")
except Exception as e:
    pass
')"
            envsubst < apps.json > /tmp/apps.json
          else
            echo "[]" > /tmp/apps.json
          fi

      - name: Build smoke-test image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          load: true
          tags: custom-frappe:ci
          secrets: |
            id=apps_json,src=/tmp/apps.json
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          docker run --rm --entrypoint bash custom-frappe:ci -lc \
            "test -d /home/frappe/frappe-bench/apps/frappe && test -f /home/frappe/frappe-bench/assets/assets.json && bench --version"
